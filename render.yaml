
services:
  - type: web
    name: black-x
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: node server/src/index.js

    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 24.21.0

      - key: JWT_SECRET
        generateValue: true

      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
